[project]
name = "codebase-intelligence-assistant"
version = "0.1.0"
description = "Local-first codebase question answering pipeline."
requires-python = ">=3.11"
dependencies = [
    "chromadb>=0.5,<1.0",
    "gitpython>=3.1,<4.0",
    "openai>=1.0,<2.0",
    "rank-bm25>=0.2.2",
    "torch>=2.2,<3.0",
    "tree-sitter>=0.20.1,<0.21",
    "tree-sitter-languages>=1.10.2,<2.0",
    "transformers>=4.40,<5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
eval = [
    "datasets>=2.18,<4.0",
    "langchain-community>=0.2,<1.0",
    "ragas>=0.1,<1.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
